<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Explora el Mundo Pokémon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    <header class="header">
        <img src="https://raw.githubusercontent.com/PokeAPI/media/master/logo/pokeapi_256.png" alt="Pokémon Logo" class="logo">
        <button class="login-btn">Iniciar sesión</button>
    </header>
    <main class="main-content">
        <section class="hero">
            <h1 class="main-title">Explora el Mundo Pokémon</h1>
            <h2 class="main-subtitle">¡Atrapa, explora y conoce a tus Pokémon favoritos!</h2>
            <p class="main-desc">Descubre información y curiosidades de cientos de Pokémon. Desliza el carrusel para ver más y haz clic en tu favorito para verlo en detalle.</p>
            <div id="pokemonDisplay" class="pokemon-display">
                <!-- Aquí se mostrará el Pokémon seleccionado -->
            </div>
        </section>
        <section class="carousel-section">
            <h3 class="carousel-title">Pokémon Populares</h3>
            <div class="carousel-container">
                <button class="carousel-btn left" id="carouselLeft">&#10094;</button>
                <div class="carousel" id="pokemonCarousel">
                    <!-- Aquí se cargarán los Pokémon desde la API -->
                </div>
                <button class="carousel-btn right" id="carouselRight">&#10095;</button>
            </div>
        </section>
    </main>
    <footer class="footer">
        Pokémon Landing Page - 2024
    </footer>
    <script src="script.js"></script>
</body>
</html>
